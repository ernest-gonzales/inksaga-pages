const chapters=[
[1,"The End","Logen flees a Shanka attack after losing contact with his companions. A fight at the edge of a gorge ends with Logen and one of the attackers falling into the ravine."],
[2,"The Survivors","Logen survives the fall and returns to the wrecked camp for supplies. Believing the rest of his band are probably dead, he heads alone toward the High Places."],
[3,"Questions","Inquisitor Glokta questions Salem Rews and forces him to confess to a wider Mercer corruption scheme. Arch Lector Sult directs Glokta toward more important targets, beginning with Sepp dan Teufel."],
[4,"No Choice at All","Stranded in the High Places, Logen learns from the spirits that Bethod is making war and that a Magus is searching for him. With no better purpose left, he decides to travel south and find the Magus."],
[5,"Playing with Knives","Captain Jezal dan Luthar's comfortable life of cards and drinking is contrasted with Marshal Varuz's demanding preparation for the Contest. A street encounter with the Inquisition reveals an uneasy shared history between Major West and Glokta."],
[6,"Teeth and Fingers","Glokta interrogates Sepp dan Teufel, the Master of the Mints. Under torture, Teufel breaks and agrees to confess."],
[7,"The Wide and Barren North","Logen meets Malacus Quai, an ailing apprentice sent by Bayaz to find him. Logen helps him toward the Great Northern Library and is forced into another violent encounter on the road."],
[8,"Fencing Practice","Jezal's training with Major West improves while he becomes fascinated by West's sister, Ardee. Ardee's meeting with Glokta also reveals that Glokta was once a celebrated fencer and a friend of the West family."],
[9,"The Morning Ritual","Glokta's painful daily routine is followed by another meeting with Sult. Sult explains how much power lies in the Closed Council and orders the investigation of the Mercers to go deeper, regardless of who is implicated."],
[10,"First of the Magi","Logen reaches the Great Northern Library with Quai and meets Bayaz. Envoys from Bethod are turned away, and Bayaz demonstrates enough power to make clear that he is no ordinary old man."],
[11,"The Good Man","Major West watches Lord Chamberlain Hoff receive petitioners, merchants, Northern envoys and finally Yoru Sulfur, who claims to speak for Bayaz. Sulfur's arrival is treated as serious enough to trigger an urgent Closed Council meeting."],
[12,"On the List","Glokta's raid on Villem dan Robb's home finds the suspect freshly murdered. Sult decides to use Salem Rews as bait for the killer, while Marshal Varuz separately asks Glokta to help motivate Jezal."],
[13,"An Offer and a Gift","Jezal's punishing training continues as politics turn openly threatening. In the Open Council, White-Eye Hansul and the seemingly unnatural Fenris the Feared deliver Bethod's demands and promise that three signs will precede war."],
[14,"The King of the Northmen","Bethod comes to Bayaz in person with Scale and the sorceress Caurib, demanding the Magus's support. Bayaz refuses, recalls the aid he once gave Bethod, and the meeting ends with open hostility toward both Bayaz and Logen."],
[15,"A Road Between Two Dentists","Glokta hides Rews and catches the hired killer sent to silence him. The assassin is taken to a secret interrogation room, where Glokta begins working for names and evidence."],
[16,"Flatheads","The Dogman, Threetrees, Dow, Tul, Grim and Forley ambush a group of Shanka. Their victory is overshadowed by the realization that far larger numbers may soon move south."],
[17,"The Course of True Love","Glokta and Ardee each puncture Jezal's vanity in different ways. Furious at being judged lazy and shallow, Jezal finally finds a genuine reason to work and resolves to win the Contest."],
[18,"How Dogs Are Trained","Glokta captures senior Mercer Gofred Hornlach and methodically forces him to repeat the confession Glokta needs. Hornlach agrees to implicate Magister Kault and the Guild before the Open Council."],
[19,"Tea and Vengeance","On the road south, Bayaz, Logen and Quai are ambushed by Blacktoe and other Northmen. Bayaz uses the Art, but Logen still has to kill men he once knew, leaving him disgusted by how little his life seems to have changed."],
[20,"What Freedom Looks Like","Ferro Maljinn is introduced as a fugitive driven almost entirely by vengeance against Gurkhul. Yulwei finds her, protects her with powers she does not understand, and begins persuading her that survival might offer something beyond revenge."],
[21,"The King's Justice","The Mercer case is turned into public spectacle: Rews and Hornlach testify, the Guild is dissolved and its leaders condemned. Jezal witnesses Glokta's effectiveness and later settles back into an easier companionship with Ardee."],
[22,"Means of Escape","Glokta raids the Mercers' Guildhall for Magister Kault. Before dying in an attempted escape, Kault warns Glokta that the conspiracy is larger than he understands and points him toward the Closed Council, the Inquisition, the University and the banks."],
[23,"Three Signs","West confronts Jezal over Ardee, then learns that Bethod's forces have broken into Angland. Lord Marshal Burr appoints West to his staff, giving the common-born officer a major wartime responsibility."],
[24,"The Theatrical Outfitter's","Bayaz, Logen and Quai arrive in Adua. Logen is overwhelmed by the scale and customs of the city while Bayaz has the group dressed for their formal appearance before the Union's rulers."],
[25,"Barbarians at the Gate","Jezal's public preparation for the Contest draws powerful observers. Bayaz and his companions enter the Agriont, Yoru Sulfur recognizes his master, and Jezal escorts the strange visitors to a meeting with members of the Closed Council."],
[26,"Next","Sult orders Glokta to investigate the man claiming to be Bayaz and discredit him before he can claim the traditional Magus seat on the Closed Council. Glokta also follows the Mercer trail toward the mysterious banking house of Valint and Balk."],
[27,"Better than Death","Yulwei leads Ferro north through Gurkish territory while military preparations gather around them. Ferro is repeatedly forced to confront how deeply slavery and revenge still control her choices."],
[28,"Sore Thumb","Logen explores Adua as an obvious outsider and observes the Union's soldiers with a veteran's eye. That night an unnatural attacker tears into Bayaz's quarters; Bayaz calls the creature an Eater sent by Khalul."],
[29,"Questions","Glokta investigates the extraordinary damage around Bayaz's quarters and questions the supposed Magus directly. Bayaz's response leaves Glokta less certain that a mundane fraud can explain what he has seen."],
[30,"Nobility","The Contest begins and Jezal advances under intense public scrutiny. Away from the fencing circle, his attempt to distance himself from Ardee collapses when the two finally kiss."],
[31,"Dark Work","The Dogman's band captures a man connected to Bethod's forces and learns how thoroughly Bethod has crushed his rivals. With no friendly chief left to warn about the Shanka, Forley volunteers to carry the warning to Bethod himself."],
[32,"Words and Dust","Glokta searches the University for reliable history about Bayaz and Kanedias. An old record links Bayaz to the fall of the Maker, the mysterious Seed, and the key to the sealed House of the Maker."],
[33,"The Remarkable Talents of Brother Longfoot","Bayaz recruits Brother Longfoot, a boastful but experienced Navigator, for the journey he is assembling. Logen's trip through Adua again shows how poorly his instincts fit the crowded city, even when they keep him alive."],
[34,"Her Kind Fight Everything","Ferro and Yulwei are hunted by two Eaters. The confrontation shows how dangerous the Eaters are and how far beyond ordinary violence the struggle between the Magi and Khalul has become."],
[35,"She Loves Me… Not","Jezal continues advancing through the Contest while his feelings for Ardee destabilize the easy confidence he once had. A sudden outburst at his friends makes him realize that her opinion matters to him because she does not admire him automatically."],
[36,"The Seed","Glokta follows Severard's research into Valint and Balk and examines the remains left by the attack on Bayaz. The evidence points toward human consumption, but the newly arrived Superior Goyle and his Practicals force the official explanation to become simply 'dogs.'"],
[37,"Never Bet Against a Magus","Jezal meets Bremer dan Gorst in the Contest final and somehow finds a level of speed and confidence beyond anything he has shown before. He wins the Contest and is celebrated before the King and the royal family."],
[38,"The Ideal Audience","Bayaz faces Sult and the Closed Council at a formal dinner designed to expose him as a fraud. Instead of performing for them, he produces the key to the House of the Maker and names Glokta and Jezal as witnesses for the opening."],
[39,"The House of the Maker","Bayaz opens the House of the Maker and leads Glokta, Jezal and Logen through its impossible interior. They learn more of Kanedias and Tolomei, and Logen carries a dark metal box out before the ancient doors are sealed again."],
[40,"Nobody's Dog","West struggles under the practical burden of preparing the Union for war and encounters Yulwei and Ferro arriving in Adua. Later, a furious confrontation with Ardee turns violent and exposes the abuse and abandonment that shaped their family."],
[41,"Each Man Worships Himself","Ferro is brought into Bayaz's circle. Yulwei and Bayaz speak more openly about Khalul, the Eaters and the Seed before Yulwei leaves Ferro in Bayaz's care for the coming journey."],
[42,"Old Friends","West visits Glokta before leaving for war and the two finally speak honestly about their shared past. West asks Glokta to watch over Ardee, and Glokta unexpectedly agrees to renew the friendship and help her."],
[43,"Back to the Mud","Forley's attempt to warn Bethod ends in his death. Threetrees and the others retaliate against the men responsible, then bury Forley with respect for the courage shown by the man long called the Weakest."],
[44,"Misery","Jezal and Ardee part badly as he prepares to sail for Angland. Before he can leave, Bayaz and senior Union officials remove him from military duty and assign him to Bayaz's expedition toward the edge of the World."],
[45,"The Bloody-Nine","The group is attacked before it can leave Adua. Logen's most terrifying side emerges in the fighting, Ferro and the others are drawn into the violence, and Bayaz ends the assault with an unmistakable and horrifying display of power."],
[46,"The Tools We Have","Glokta keeps his promise to West by checking on Ardee. After Goyle's failed attempt against Bayaz's group, Sult gives Glokta sweeping authority and sends him south to investigate the crisis in Dagoska, with Practical Vitari among the people assigned to him."]
];

const categories=['Character','Place','Faction','Concept'];let chapter=Number(localStorage.getItem('inksaga-progress')||1);if(chapter<1||chapter>46)chapter=1;let category='Character',selected='logen',query='';
const byId=id=>entities.find(e=>e.id===id), visible=e=>e.intro<=chapter, names=e=>e.names.filter(n=>n.from<=chapter), display=e=>{const ds=names(e).filter(n=>n.kind==='display');return ds.length?ds[ds.length-1].value:null}, latest=arr=>arr.filter(x=>x.from<=chapter).sort((a,b)=>b.from-a.from)[0], esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), initials=n=>n.split(' ').filter(x=>!['dan','the','of'].includes(x.toLowerCase())).slice(0,2).map(x=>x[0]).join('').toUpperCase();
function renderTabs(){document.getElementById('tabs').innerHTML=categories.map(c=>`<button class="${c===category&&!query?'active':''}" data-cat="${c}">${c==='Category'?'Categories':c+'s'}</button>`).join('');document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{category=b.dataset.cat;query='';document.getElementById('search').value='';selected=(entities.find(e=>visible(e)&&e.category===category)||{}).id||'';render()})}
function renderProgress(){const sel=document.getElementById('chapterSelect');sel.innerHTML=chapters.map(c=>`<option value="${c[0]}">${c[0]}. ${esc(c[1])}</option>`).join('');sel.value=chapter;document.getElementById('chapterRange').value=chapter;document.getElementById('chapterLabel').textContent=`Chapter ${chapter}`;document.getElementById('chapterCount').textContent=`${chapter} / 46`;const c=chapters[chapter-1];document.getElementById('chapter').innerHTML=`<article class="chapter-card"><div><p class="eyebrow">Current chapter snapshot</p><h2>Chapter ${c[0]} · ${esc(c[1])}</h2><p>${esc(c[2])}</p></div><span class="pill">◉ Safe through Chapter ${chapter}</span></article>`}
function renderList(){let pool=entities.filter(visible);if(query){const q=query.toLowerCase();pool=pool.filter(e=>names(e).some(n=>n.value.toLowerCase().includes(q)))}else pool=pool.filter(e=>e.category===category);document.getElementById('browseTitle').textContent=query?'Safe search results':`${category}s you know`;document.getElementById('entityList').innerHTML=pool.length?pool.map(e=>{const n=display(e);return `<button class="${e.id===selected?'selected':''}" data-id="${e.id}"><span class="avatar">${initials(n)}</span><span class="item-copy"><strong>${esc(n)}</strong><small>${e.category}</small></span></button>`}).join(''):`<p class="muted">${query?'No spoiler-safe matches yet.':'Nothing safely known here yet.'}</p>`;document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{selected=b.dataset.id;const e=byId(selected);category=e.category;render()});if(!pool.find(e=>e.id===selected)&&pool[0])selected=pool[0].id}
function renderProfile(){const e=byId(selected);if(!e||!visible(e)){document.getElementById('profile').innerHTML='<article class="panel empty"><h2>Nothing known here yet</h2><p class="muted">Choose another category or continue reading.</p></article>';return}const n=display(e),alias=names(e).filter(x=>x.kind==='alias'&&x.value!==n),sum=latest(e.summaries),facts=e.facts.filter(x=>x.from<=chapter),rels=e.relations.filter(x=>x.from<=chapter).map(r=>({r,t:byId(r.target)})).filter(x=>x.t&&visible(x.t)),miles=e.summaries.filter(x=>x.from<=chapter),future=[...e.names,...e.summaries,...e.facts,...e.relations].some(x=>x.from>chapter);document.getElementById('profile').innerHTML=`<div class="breadcrumbs">The First Law <span>›</span> ${e.category}s <span>›</span> ${esc(n)}</div><article class="hero"><div class="portrait"><span>${initials(n)}</span></div><div class="hero-copy"><p class="eyebrow">${e.category}</p><h1>${esc(n)}</h1>${alias.length?`<p class="aliases">Also known as ${alias.map(x=>esc(x.value)).join(' · ')}</p>`:''}<p class="summary">${esc(sum?.text||'')}</p><span class="pill">◉ Known through Chapter ${chapter}</span></div></article><div class="grid"><article class="panel"><div class="section-title"><div><p class="eyebrow">Current knowledge</p><h3>What you know now</h3></div><span class="pill">Safe</span></div>${facts.length?`<div class="fact-grid">${facts.map(f=>`<div class="fact"><span>${esc(f.label)}</span><strong>${esc(f.value)}</strong></div>`).join('')}</div>`:'<p class="muted">No additional structured facts are needed at this point.</p>'}<div class="locked"><span>⌁</span><div><strong>Future knowledge stays invisible</strong><p>${future?'There is more to discover, but future names, counts and content are hidden.':'This profile is complete through the loaded book.'}</p></div></div></article><article class="panel"><div class="section-title"><div><p class="eyebrow">Connections</p><h3>Relationships</h3></div></div><div class="relations">${rels.length?rels.map(x=>`<div><span class="avatar">${initials(display(x.t))}</span><div class="item-copy"><strong>${esc(display(x.t))}</strong><small>${esc(x.r.kind)}</small></div></div>`).join(''):'<p class="muted">No relationships are safely established at this point.</p>'}</div></article></div><article class="panel timeline"><div class="section-title"><div><p class="eyebrow">Progressive knowledge</p><h3>How this profile has grown</h3></div></div><div class="milestones">${miles.map((m,i)=>`<div class="milestone"><span class="dot">✓</span><strong>Ch. ${m.from}</strong><small>${i?'Profile updated':'First known'}</small></div>`).join('')}${future?'<div class="milestone future"><span class="dot"></span><strong>Future</strong><small>Keep reading</small></div>':''}</div></article>`}
function render(){localStorage.setItem('inksaga-progress',chapter);renderTabs();renderProgress();renderList();renderProfile()}
