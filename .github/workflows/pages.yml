name: Deploy InkSaga Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout generated website
        uses: actions/checkout@v4

      - name: Verify deployment
        run: |
          test -f index.html
          grep -q 'InkSaga' index.html
          if find . -type f -iname '*.epub' -print -quit | grep -q .; then
            echo 'EPUB source file must not be published' >&2
            exit 1
          fi

      - name: Prepare website-only artifact
        run: |
          rm -rf /tmp/inksaga-site
          mkdir -p /tmp/inksaga-site
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name README.md -exec cp -a {} /tmp/inksaga-site/ \;

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload generated site
        uses: actions/upload-pages-artifact@v4
        with:
          path: /tmp/inksaga-site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
