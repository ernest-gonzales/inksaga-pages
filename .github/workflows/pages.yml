name: Deploy InkSaga Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment manifest
        uses: actions/checkout@v4

      - name: Download exact verified private-CI artifact
        shell: bash
        run: |
          set -euo pipefail
          URL="$(python3 -c 'import json; print(json.load(open("artifact-source.json"))["downloadUrl"])')"
          EXPECTED="$(python3 -c 'import json; print(json.load(open("artifact-source.json"))["sha256"])')"
          curl --fail --location --retry 3 --output /tmp/inksaga-site.zip "$URL"
          printf '%s  %s\n' "$EXPECTED" /tmp/inksaga-site.zip | sha256sum --check --strict

      - name: Verify and unpack website-only artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/inksaga-site
          mkdir -p /tmp/inksaga-site
          unzip -q /tmp/inksaga-site.zip -d /tmp/inksaga-site
          test -f /tmp/inksaga-site/index.html
          grep -Raq 'InkSaga' /tmp/inksaga-site
          grep -Raq 'The Demon Star' /tmp/inksaga-site
          grep -Raq 'EXCISION' /tmp/inksaga-site
          if find /tmp/inksaga-site -type f -iname '*.epub' -print -quit | grep -q .; then
            echo 'EPUB source file must not be published' >&2
            exit 1
          fi
          if grep -RaqE 'sourceHref|evidenceIds|OEBPS/c5Y\.xhtml' /tmp/inksaga-site; then
            echo 'Private source/provenance data leaked into public artifact' >&2
            exit 1
          fi
          grep -Eq '/inksaga-pages/_next/static/chunks/[^"[:space:]]+\.css' /tmp/inksaga-site/index.html
          grep -Raq 'data-display="light"' /tmp/inksaga-site/index.html
          grep -Raq 'Cultures' /tmp/inksaga-site
          grep -Raq 'What happened' /tmp/inksaga-site
          grep -Raq 'What you know' /tmp/inksaga-site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload verified generated site
        uses: actions/upload-pages-artifact@v4
        with:
          path: /tmp/inksaga-site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
