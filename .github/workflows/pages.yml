name: Deploy InkSaga Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout published site
        uses: actions/checkout@v4

      - name: Prepare website-only directory
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/inksaga-site
          mkdir -p /tmp/inksaga-site
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name 'README.md' \
            -exec cp -R {} /tmp/inksaga-site/ \;

      - name: Verify checked-in static site
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/inksaga-site/index.html
          grep -Raq 'InkSaga' /tmp/inksaga-site
          grep -Raq 'The Demon Star' /tmp/inksaga-site
          if find /tmp/inksaga-site -type f \( -iname '*.epub' -o -iname '*.mobi' -o -iname '*.azw3' \) -print -quit | grep -q .; then
            echo 'Private ebook source file must not be published' >&2
            exit 1
          fi
          if grep -RaqE 'sourceHref|evidenceIds' /tmp/inksaga-site; then
            echo 'Private source/provenance data leaked into public site' >&2
            exit 1
          fi
          grep -Eq '/inksaga-pages/_next/' /tmp/inksaga-site/index.html
          grep -Raq 'data-display="light"' /tmp/inksaga-site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload checked-in static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: /tmp/inksaga-site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
