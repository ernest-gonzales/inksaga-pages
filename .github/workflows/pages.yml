name: Publish verified InkSaga site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  ARTIFACT_URL: 'https://sdmntpritalynorth.oaiusercontent.com/files/00000000-209c-8246-b55b-e5719a2a6e00/raw?se=2026-08-11T06%3A02%3A36Z&sp=r&sv=2026-02-06&sr=b&scid=2ba8e52d-fdb3-551a-866e-6ed640a06b5b&skoid=82a3371f-2f6c-4f81-8a78-2701b362559b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-11T05%3A49%3A35Z&ske=2026-08-12T05%3A49%3A35Z&sks=b&skv=2026-02-06&sig=Tq4uQp7Nu48P3CQ2SLJndPRBXiprR2U/Gahq6LENtp8%3D'

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public deployment repository
        uses: actions/checkout@v4

      - name: Download verified private build artifact
        run: |
          curl -fsSL "$ARTIFACT_URL" -o /tmp/inksaga-site.zip
          rm -rf /tmp/inksaga-site
          mkdir -p /tmp/inksaga-site
          unzip -q /tmp/inksaga-site.zip -d /tmp/inksaga-site

      - name: Verify deployment artifact
        run: |
          test -f /tmp/inksaga-site/index.html
          grep -q '/inksaga-pages/_next/' /tmp/inksaga-site/index.html
          grep -R -q 'Practical Frost' /tmp/inksaga-site/_next/static/chunks
          grep -R -q 'Practical Severard' /tmp/inksaga-site/_next/static/chunks
          grep -R -q 'Superior Kalyne' /tmp/inksaga-site/_next/static/chunks

      - name: Persist generated site only
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name README.md -exec rm -rf {} +
          cp -a /tmp/inksaga-site/. .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Publish source-verified The Blade Itself rebuild'
            git push origin HEAD:main
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload generated site
        uses: actions/upload-pages-artifact@v4
        with:
          path: /tmp/inksaga-site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
