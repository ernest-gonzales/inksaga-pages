name: Deploy InkSaga Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verified generated site
        uses: actions/checkout@v4

      - name: Verify exact artifact files
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check --strict artifact-files.sha256
          rm -rf /tmp/inksaga-site
          mkdir -p /tmp/inksaga-site
          while IFS= read -r line; do
            path="${line#*  }"
            mkdir -p "/tmp/inksaga-site/$(dirname "$path")"
            cp -- "$path" "/tmp/inksaga-site/$path"
          done < artifact-files.sha256
          test -f /tmp/inksaga-site/index.html
          grep -Raq 'InkSaga' /tmp/inksaga-site
          grep -Raq 'The Demon Star' /tmp/inksaga-site
          grep -Raq 'EXCISION' /tmp/inksaga-site
          if grep -Raq 'HARVEST' /tmp/inksaga-site; then
            echo 'Future chapter title leaked into public artifact' >&2
            exit 1
          fi
          if find /tmp/inksaga-site -type f -iname '*.epub' -print -quit | grep -q .; then
            echo 'EPUB source file must not be published' >&2
            exit 1
          fi
          if grep -RaqE 'sourceHref|evidenceIds|OEBPS/c5Y\.xhtml' /tmp/inksaga-site; then
            echo 'Private source/provenance data leaked into public artifact' >&2
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload verified generated site
        uses: actions/upload-pages-artifact@v4
        with:
          path: /tmp/inksaga-site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
